name: Build Flutter Android APK & Bundle

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Android Setup
        working-directory: ./flutter_app
        run: |
          flutter doctor -v
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Android App Bundle (.aab for Play Store)
        working-directory: ./flutter_app
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyforge-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyforge-playstore-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
