name: Build Flutter Android APK & Bundle

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native Android Project
        working-directory: ./flutter_app
        run: |
          # Backup clean pubspec.yaml
          cp pubspec.yaml pubspec.yaml.bak
          
          # Remove broken handcrafted android directory
          rm -rf android
          
          # Generate official Android platform files matching runner Flutter SDK
          flutter create --platforms=android --org com.schoolwale --project-name studyforge .
          
          # Restore exact pubspec.yaml
          cp pubspec.yaml.bak pubspec.yaml
          
          # Inject network permissions into AndroidManifest.xml
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              c = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n"""
          queries = """    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>\n"""
          if "android.permission.INTERNET" not in c:
              c = c.replace("<application", perms + queries + "    <application")
              with open(path, "w") as f:
                  f.write(c)
          '
          
          # Fetch all dependencies
          flutter pub get

      - name: Build Android Release APK
        working-directory: ./flutter_app
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_apk.log 2>&1
          EXIT_CODE=$?
          cat build_apk.log
          if [ $EXIT_CODE -ne 0 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            cd ..
            git checkout -B build-logs
            cp flutter_app/build_apk.log ./build_error.txt
            git add build_error.txt
            git commit -m "chore: save build error log [skip ci]"
            git push -f origin build-logs
            echo "❌ Flutter Build Failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyforge-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Android App Bundle (.aab for Play Store)
        working-directory: ./flutter_app
        run: flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studyforge-playstore-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
